name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check tag against package version
        run: node scripts/check-version.mjs "${{ github.ref_name }}"

  linux:
    name: Linux packages
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-19
        with:
          toolchain: 1.96.0

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            libglib2.0-bin \
            libgtk-3-bin \
            libfuse2 \
            patchelf \
            rpm \
            binutils \
            file \
            wget \
            desktop-file-utils

      - name: Install npm dependencies
        run: npm ci

      - name: Check version consistency
        run: npm run check:version "${{ github.ref_name }}"

      - name: Run frontend tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Build frontend (required before cargo test)
        run: npm run build

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Linux bundles
        run: npm run tauri build -- --bundles rpm,deb,appimage

      - name: Verify bundle filenames
        run: |
          set -euo pipefail
          version="${{ github.ref_name }}"
          version="${version#v}"
          test -f "src-tauri/target/release/bundle/rpm/Breathe-${version}-1.x86_64.rpm"
          test -f "src-tauri/target/release/bundle/deb/Breathe_${version}_amd64.deb"
          test -f "src-tauri/target/release/bundle/appimage/Breathe_${version}_amd64.AppImage"

      - name: Upload RPM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: breathe-linux-rpm
          path: src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 7

      - name: Upload DEB
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: breathe-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 7

      - name: Upload AppImage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: breathe-linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows x64 NSIS
    needs: validate
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-19
        with:
          toolchain: 1.96.0
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install npm dependencies
        run: npm ci

      - name: Check version consistency
        run: npm run check:version "${{ github.ref_name }}"

      - name: Run frontend tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Build frontend (required before cargo test)
        run: npm run build

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build NSIS installer
        run: npm run tauri build -- --bundles nsis

      - name: Verify NSIS filename
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = "src-tauri/target/release/bundle/nsis/Breathe_${version}_x64-setup.exe"
          if (-not (Test-Path $installer)) { throw "Missing $installer" }

      - name: Smoke-test the NSIS installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = (Resolve-Path "src-tauri/target/release/bundle/nsis/Breathe_${version}_x64-setup.exe").Path
          $installDir = Join-Path $env:LOCALAPPDATA "Breathe"
          $exe = Join-Path $installDir "breathe.exe"
          $uninstaller = Join-Path $installDir "uninstall.exe"
          $shortcut = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Breathe.lnk"

          Start-Process -FilePath $installer -ArgumentList "/S" -Wait
          if (-not (Test-Path $exe)) { throw "Installed binary not found at $exe" }
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller not found at $uninstaller" }
          if (-not (Test-Path $shortcut)) { throw "Start Menu shortcut not found at $shortcut" }

          # Simulate the per-user autostart value so uninstaller cleanup is exercised.
          $runKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          New-Item -Path $runKey -Force | Out-Null
          Set-ItemProperty -Path $runKey -Name "Breathe" -Value ('"' + $exe + '" --autostart')

          # Silent install must not leave a running instance behind before uninstalling.
          Get-Process -Name "breathe" -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Process -FilePath $uninstaller -ArgumentList "/S" -Wait
          for ($i = 0; $i -lt 10 -and (Test-Path $exe); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $exe) { throw "Uninstall did not remove the installed binary" }
          for ($i = 0; $i -lt 10 -and (Test-Path $shortcut); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $shortcut) { throw "Uninstall did not remove the Start Menu shortcut" }
          for ($i = 0; $i -lt 10 -and (Test-Path $uninstaller); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $uninstaller) { throw "Uninstall did not remove the uninstaller" }
          if ($null -ne (Get-ItemProperty -Path $runKey -Name "Breathe" -ErrorAction SilentlyContinue)) {
            throw "Uninstall did not remove the Breathe autostart Run value"
          }

          Write-Host "NSIS install/uninstall smoke test passed."

      - name: Upload NSIS installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: breathe-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: Linux package smoke tests
    needs: linux
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Download Linux artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: breathe-linux-*
          path: artifacts
          merge-multiple: true

      - name: Read version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Install and launch RPM on Fedora 44
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          docker run --rm -e VERSION -v "$PWD/artifacts:/artifacts:ro" fedora:44 bash -lc '
            set -euo pipefail
            dnf install -y --nogpgcheck "/artifacts/Breathe-${VERSION}-1.x86_64.rpm"
            dnf install -y xorg-x11-server-Xvfb dbus-daemon dbus-tools >/dev/null
            test -x /usr/bin/breathe
            test -f /usr/share/applications/Breathe.desktop
            rpm -q breathe
            useradd -m tester
            set +e
            runuser -u tester -- env WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 \
              timeout 20s dbus-run-session -- xvfb-run -a /usr/bin/breathe
            code=$?
            set -e
            echo "RPM app exit code: $code"
            test "$code" -eq 124
          '

      - name: Install and launch DEB on Ubuntu 24.04
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          docker run --rm -e VERSION -v "$PWD/artifacts:/artifacts:ro" ubuntu:24.04 bash -lc '
            set -euo pipefail
            apt-get update -qq
            apt-get install -y -qq "/artifacts/Breathe_${VERSION}_amd64.deb"
            apt-get install -y -qq xvfb dbus >/dev/null
            test -x /usr/bin/breathe
            test -f /usr/share/applications/Breathe.desktop
            dpkg -s breathe | grep -q "Status: install ok installed"
            useradd -m tester
            set +e
            runuser -u tester -- env WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 \
              timeout 20s dbus-run-session -- xvfb-run -a /usr/bin/breathe
            code=$?
            set -e
            echo "DEB app exit code: $code"
            test "$code" -eq 124
          '

      - name: Install and launch DEB on Debian 12
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          docker run --rm -e VERSION -v "$PWD/artifacts:/artifacts:ro" debian:12 bash -lc '
            set -euo pipefail
            apt-get update -qq
            apt-get install -y -qq "/artifacts/Breathe_${VERSION}_amd64.deb"
            apt-get install -y -qq xvfb dbus >/dev/null
            test -x /usr/bin/breathe
            test -f /usr/share/applications/Breathe.desktop
            dpkg -s breathe | grep -q "Status: install ok installed"
            useradd -m tester
            set +e
            runuser -u tester -- env WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 \
              timeout 20s dbus-run-session -- xvfb-run -a /usr/bin/breathe
            code=$?
            set -e
            echo "DEB app exit code: $code"
            test "$code" -eq 124
          '

      - name: Run AppImage on Ubuntu 24.04
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          docker run --rm -e VERSION -v "$PWD/artifacts:/artifacts:ro" ubuntu:24.04 bash -lc '
            set -euo pipefail
            apt-get update -qq
            apt-get install -y -qq xvfb dbus libgtk-3-0 libwebkit2gtk-4.1-0 \
              libappindicator3-1 libfribidi0 libfontconfig1 >/dev/null
            cp "/artifacts/Breathe_${VERSION}_amd64.AppImage" /tmp/Breathe.AppImage
            chmod +x /tmp/Breathe.AppImage
            useradd -m tester
            set +e
            runuser -u tester -- env WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 \
              timeout 20s dbus-run-session -- xvfb-run -a \
              /tmp/Breathe.AppImage --appimage-extract-and-run
            code=$?
            set -e
            echo "AppImage exit code: $code"
            test "$code" -eq 124
          '

      - name: Run AppImage on Fedora 44
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          docker run --rm -e VERSION -v "$PWD/artifacts:/artifacts:ro" fedora:44 bash -lc '
            set -euo pipefail
            dnf install -y xorg-x11-server-Xvfb dbus-daemon dbus-tools \
              gtk3 webkit2gtk4.1 libappindicator-gtk3 fribidi fontconfig >/dev/null
            cp "/artifacts/Breathe_${VERSION}_amd64.AppImage" /tmp/Breathe.AppImage
            chmod +x /tmp/Breathe.AppImage
            useradd -m tester
            set +e
            runuser -u tester -- env WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 \
              timeout 20s dbus-run-session -- xvfb-run -a \
              /tmp/Breathe.AppImage --appimage-extract-and-run
            code=$?
            set -e
            echo "AppImage exit code: $code"
            test "$code" -eq 124
          '

  publish:
    name: Publish GitHub Release
    needs: [smoke, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify artifacts and render AUR files
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          for artifact in \
            "artifacts/Breathe-${version}-1.x86_64.rpm" \
            "artifacts/Breathe_${version}_amd64.deb" \
            "artifacts/Breathe_${version}_amd64.AppImage" \
            "artifacts/Breathe_${version}_x64-setup.exe"; do
            test -f "$artifact" || {
              echo "::error::Missing required artifact: $artifact"
              ls -l artifacts
              exit 1
            }
          done

          mkdir -p dist
          git archive --format=tar.gz --prefix="breathe-${version}/" \
            -o "dist/Breathe-${version}-source.tar.gz" "$TAG"
          source_sha=$(sha256sum "dist/Breathe-${version}-source.tar.gz" | awk '{print $1}')
          node scripts/render-aur.mjs "$version" "$source_sha" dist/aur
          tar -C dist/aur -czf "dist/Breathe-${version}-aur.tar.gz" PKGBUILD .SRCINFO
          echo "SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"

      - name: Validate rendered AUR metadata
        run: |
          docker run --rm -e SOURCE_SHA -v "$PWD/dist/aur:/rendered:ro" \
            archlinux:base-devel bash -lc '
              set -euo pipefail
              pacman -Sy --noconfirm --needed git >/dev/null
              useradd -m builder
              cp -r /rendered /home/builder/rendered
              chown -R builder:builder /home/builder
              runuser -u builder -- bash -lc "cd /home/builder/rendered && makepkg --printsrcinfo" > /tmp/rendered.SRCINFO
              diff -u /home/builder/rendered/.SRCINFO /tmp/rendered.SRCINFO
              grep -q "sha256sums = ${SOURCE_SHA}" /tmp/rendered.SRCINFO
            '

      - name: Write release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          cat > release-notes.md <<'EOF'
          ## Breathe __VERSION__

          Calm movement and eye-rest reminders for Linux and Windows.

          ### Downloads

          | Platform | File |
          | --- | --- |
          | Fedora / RPM | `Breathe-__VERSION__-1.x86_64.rpm` |
          | Debian / Ubuntu | `Breathe___VERSION___amd64.deb` |
          | Linux AppImage | `Breathe___VERSION___amd64.AppImage` |
          | Windows 10/11 x64 | `Breathe___VERSION___x64-setup.exe` |
          | Arch Linux | `Breathe-__VERSION__-aur.tar.gz` |
          | Source | `Breathe-__VERSION__-source.tar.gz` |

          ### Install

          Fedora:

          ```bash
          sudo dnf install ./Breathe-__VERSION__-1.x86_64.rpm
          ```

          Debian / Ubuntu:

          ```bash
          sudo apt install ./Breathe___VERSION___amd64.deb
          ```

          AppImage:

          ```bash
          chmod +x Breathe___VERSION___amd64.AppImage
          ./Breathe___VERSION___amd64.AppImage
          ```

          The AppImage is built on Ubuntu 22.04, so it requires glibc 2.35 or
          newer and a desktop with the usual GTK/WebKitGTK runtime libraries.
          It is smoke-tested on Ubuntu 24.04 and Fedora 44. Use the native RPM
          or DEB package when possible.

          Arch Linux:

          ```bash
          mkdir breathe-aur
          tar -xzf Breathe-__VERSION__-aur.tar.gz -C breathe-aur
          cd breathe-aur
          makepkg -si
          ```

          Windows:

          Run `Breathe___VERSION___x64-setup.exe`. The installer is per-user and
          does not require administrator rights. If WebView2 is missing, the
          installer downloads the bootstrapper and therefore needs an internet
          connection. The installer is not code-signed, so Windows SmartScreen
          may show a warning.

          ### Notes

          - Linux notifications need a working notification daemon and tray
            support needs a StatusNotifier host. niri with a suitable tray host
            is the tested environment; GNOME and KDE use the same XDG and
            freedesktop services but were not individually re-verified for this
            release.
          - Windows notifications use the native toast API. Focus Assist and
            notification settings can suppress them.
          - No package was installed on physical Windows hardware as part of
            this release; the NSIS installer is smoke-tested on a Windows CI
            runner. Notifications, tray interaction, and startup behavior still
            need manual verification on Windows 10/11.
          - The Arch package metadata is validated in CI, but a full
            `makepkg -si` build should be checked before submitting to the AUR.
          - The Windows installer and the Linux packages are not signed with a
            repository key.
          - Breathe never blocks the screen. Reminders are ordinary
            notifications.
          EOF
          sed -i "s/__VERSION__/${version}/g" release-notes.md

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "Breathe ${version}" \
              --notes-file release-notes.md \
              --latest
          else
            gh release create "$TAG" \
              --title "Breathe ${version}" \
              --notes-file release-notes.md \
              --verify-tag \
              --latest
          fi

          gh release upload "$TAG" \
            "artifacts/Breathe-${version}-1.x86_64.rpm" \
            "artifacts/Breathe_${version}_amd64.deb" \
            "artifacts/Breathe_${version}_amd64.AppImage" \
            "artifacts/Breathe_${version}_x64-setup.exe" \
            "dist/Breathe-${version}-source.tar.gz" \
            "dist/Breathe-${version}-aur.tar.gz" \
            --clobber
