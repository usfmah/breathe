name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  linux:
    name: Linux packages
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-19
        with:
          toolchain: 1.96.0

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            libglib2.0-bin \
            libgtk-3-bin \
            libfuse2 \
            patchelf \
            rpm \
            binutils \
            file \
            wget \
            desktop-file-utils

      - name: Install npm dependencies
        run: npm ci

      - name: Check version consistency
        run: npm run check:version

      - name: Run frontend tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Build frontend (required before cargo test)
        run: npm run build

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Linux bundles
        run: npm run tauri build -- --bundles rpm,deb,appimage

      - name: Verify bundle filenames
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          test -f "src-tauri/target/release/bundle/rpm/Breathe-${version}-1.x86_64.rpm"
          test -f "src-tauri/target/release/bundle/deb/Breathe_${version}_amd64.deb"
          test -f "src-tauri/target/release/bundle/appimage/Breathe_${version}_amd64.AppImage"

      - name: Upload RPM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: breathe-linux-rpm
          path: src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 7

      - name: Upload DEB
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: breathe-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 7

      - name: Upload AppImage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: breathe-linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows x64 NSIS
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-19
        with:
          toolchain: 1.96.0
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install npm dependencies
        run: npm ci

      - name: Check version consistency
        run: npm run check:version

      - name: Run frontend tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Build frontend (required before cargo test)
        run: npm run build

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build NSIS installer
        run: npm run tauri build -- --bundles nsis

      - name: Verify NSIS filename
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = "src-tauri/target/release/bundle/nsis/Breathe_${version}_x64-setup.exe"
          if (-not (Test-Path $installer)) { throw "Missing $installer" }

      - name: Smoke-test the NSIS installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = (Resolve-Path "src-tauri/target/release/bundle/nsis/Breathe_${version}_x64-setup.exe").Path
          $installDir = Join-Path $env:LOCALAPPDATA "Breathe"
          $exe = Join-Path $installDir "breathe.exe"
          $uninstaller = Join-Path $installDir "uninstall.exe"
          $shortcut = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Breathe.lnk"

          Start-Process -FilePath $installer -ArgumentList "/S" -Wait
          if (-not (Test-Path $exe)) { throw "Installed binary not found at $exe" }
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller not found at $uninstaller" }
          if (-not (Test-Path $shortcut)) { throw "Start Menu shortcut not found at $shortcut" }

          # Simulate the per-user autostart value so uninstaller cleanup is exercised.
          $runKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          New-Item -Path $runKey -Force | Out-Null
          Set-ItemProperty -Path $runKey -Name "Breathe" -Value ('"' + $exe + '" --autostart')

          # Silent install must not leave a running instance behind before uninstalling.
          Get-Process -Name "breathe" -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Process -FilePath $uninstaller -ArgumentList "/S" -Wait
          for ($i = 0; $i -lt 10 -and (Test-Path $exe); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $exe) { throw "Uninstall did not remove the installed binary" }
          for ($i = 0; $i -lt 10 -and (Test-Path $shortcut); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $shortcut) { throw "Uninstall did not remove the Start Menu shortcut" }
          for ($i = 0; $i -lt 10 -and (Test-Path $uninstaller); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $uninstaller) { throw "Uninstall did not remove the uninstaller" }
          if ($null -ne (Get-ItemProperty -Path $runKey -Name "Breathe" -ErrorAction SilentlyContinue)) {
            throw "Uninstall did not remove the Breathe autostart Run value"
          }

          Write-Host "NSIS install/uninstall smoke test passed."

      - name: Upload NSIS installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: breathe-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  aur:
    name: AUR metadata
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Render release metadata with a placeholder checksum
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          dummy_sha=$(printf 'a%.0s' {1..64})
          rm -rf /tmp/aur-rendered
          node scripts/render-aur.mjs "$version" "$dummy_sha" /tmp/aur-rendered

      - name: Validate PKGBUILD and .SRCINFO in an Arch container
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/packaging/aur:/template:ro" \
            -v "/tmp/aur-rendered:/rendered:ro" \
            archlinux:base-devel bash -lc '
              set -euo pipefail
              pacman -Sy --noconfirm --needed git >/dev/null
              useradd -m builder
              cp -r /template /home/builder/template
              cp -r /rendered /home/builder/rendered
              chown -R builder:builder /home/builder
              runuser -u builder -- bash -lc "cd /home/builder/template && makepkg --printsrcinfo" > /tmp/template.SRCINFO
              diff -u /home/builder/template/.SRCINFO /tmp/template.SRCINFO
              runuser -u builder -- bash -lc "cd /home/builder/rendered && makepkg --printsrcinfo" > /tmp/rendered.SRCINFO
              grep -q "sha256sums = aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" /tmp/rendered.SRCINFO
            '
