<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Page not found — Breathe</title>
    <link rel="icon" type="image/png" href="/breathe/favicon.png" />
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f2e8;
        --ink: #1f2a24;
        --muted: #5f6b62;
        --line: rgba(31, 42, 36, 0.14);
        --accent: #476b56;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #121815;
          --ink: #eef3eb;
          --muted: #a6b2a9;
          --line: rgba(238, 243, 235, 0.14);
          --accent: #a8c9ad;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: var(--bg);
        color: var(--ink);
        font-family:
          ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }
      main {
        width: min(100%, 34rem);
        border: 1px solid var(--line);
        border-radius: 1.5rem;
        padding: clamp(2rem, 7vw, 3.5rem);
        background: color-mix(in srgb, var(--bg) 82%, var(--ink) 4%);
      }
      .mark {
        width: 3rem;
        height: 3rem;
        color: var(--accent);
      }
      h1 {
        margin: 1.5rem 0 0.75rem;
        font-family: ui-serif, Georgia, "Times New Roman", serif;
        font-size: clamp(2.2rem, 7vw, 3.5rem);
        font-weight: 500;
        letter-spacing: -0.04em;
        line-height: 1;
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.65;
      }
      a {
        display: inline-block;
        margin-top: 2rem;
        color: var(--accent);
        font-weight: 650;
        text-underline-offset: 0.22em;
      }
      a:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 4px;
        border-radius: 0.2rem;
      }
    </style>
  </head>
  <body>
    <main>
      <svg
        class="mark"
        viewBox="0 0 64 64"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <path
          d="M50.6 13.4C37.2 13 23 18.4 17.1 29.2c-4 7.3-2.1 15.4 4.7 19.6 6.8 4.2 15.5 2.5 19.8-4.1 5.1-7.9 2.9-18.8 9-31.3Z"
          stroke="currentColor"
          stroke-width="3.2"
          stroke-linejoin="round"
        />
        <path
          d="M15.8 51.2c3.1-9.2 9.2-16.7 18.3-22.4"
          stroke="currentColor"
          stroke-width="3.2"
          stroke-linecap="round"
        />
      </svg>
      <h1>That page took a breath.</h1>
      <p>
        The address does not exist, but the calm reminder app is still one click
        away.
      </p>
      <a href="/breathe/">Return to Breathe</a>
    </main>
  </body>
</html>
