<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Breathe</title>
    <script>
      // Paint the correct theme on the very first frame to avoid a flash of the
      // wrong background. The authoritative value still comes from the Rust
      // settings store once the app mounts.
      (function () {
        try {
          var pref = localStorage.getItem("breathe.theme");
          var dark =
            pref === "dark" ||
            ((pref === null || pref === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (_) {
          /* ignore – fall back to the default light theme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
