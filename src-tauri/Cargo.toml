[package]
name = "breathe"
version = "0.2.1"
description = "A calm, minimal desktop app that reminds you to move and rest your eyes."
authors = ["Yousuf Mahmoud <usfmah@users.noreply.github.com>"]
edition = "2021"
rust-version = "1.96.0"
license = "MIT"
readme = "../README.md"

[lib]
name = "breathe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2.7.0"
tauri-plugin-store = "2.5.0"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Used only for the Linux GetServerInformation pre-flight. Windows toasts go
# through `tauri-plugin-notification` and WinRT directly.
[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4.18"
# The popup's Wayland placement: the GtkWindow handle (same gtk-rs version
# Tauri already uses) and runtime loading of the optional libgtk-layer-shell.
gtk = "0.18"
libloading = "0.7"

# The popup's macOS window behaviour (non-activating show, floating level,
# rounded corners). Same versions Tauri already uses; public AppKit APIs only.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSColor",
  "NSResponder",
  "NSView",
  "NSWindow",
  "objc2-quartz-core",
] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
