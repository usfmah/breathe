[package]
name = "breathe"
version = "0.1.1"
description = "A calm, minimal desktop app that reminds you to move and rest your eyes."
authors = ["Yousuf Mahmoud <usfmah@users.noreply.github.com>"]
edition = "2021"
rust-version = "1.96.0"
license = "MIT"
readme = "../README.md"

[lib]
name = "breathe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2.7.0"
tauri-plugin-store = "2.5.0"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Used only for the Linux GetServerInformation pre-flight. Windows toasts go
# through `tauri-plugin-notification` and WinRT directly.
[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4.18"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
